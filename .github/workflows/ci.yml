# Every push and pull request (task T-04): backend tests on SQLite and on PostgreSQL 17 (Supabase's
# version), frontend tests and build, and the security scanners. Nothing here reaches Supabase or any
# other real database: the PostgreSQL is a throwaway service container.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vxadmin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vxadmin" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU-only PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q -p no:cacheprovider
      - name: Tests on PostgreSQL 17
        env:
          VERNEX_TEST_POSTGRES_URL: postgresql://vxadmin:ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q -p no:cacheprovider tests/test_postgres.py
      - name: Dependency audit and security lint
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit found advisories (see docs/RUNBOOK.md for the accepted ones)"
          bandit -r app -q --severity-level medium

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found advisories"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
